<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองคิวลงแลป (NCD SSKH)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4f46e5', primaryHover: '#4338ca', secondary: '#f8fafc' }
                }
            }
        }
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); /* ไล่สีฟ้า-ครามพาสเทล ดูสวยพรีเมียม */
            background-attachment: fixed;
            color: #334155; 
        }
        
        /* ซ่อน Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animation */
        .layout-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Calendar Styles - ปรับขอบและเงาให้ชัดเจน ไม่กลืนพื้นหลัง */
        .day-cell { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid #e2e8f0; /* ขอบเข้มขึ้น */
            background-color: #ffffff; 
            position: relative; 
            z-index: 1; 
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04); /* เพิ่มเงาให้กล่องลอยขึ้นจากพื้นหลัง */
            color: #334155;
        }
        
        /* Hover Effect */
        .day-cell:hover:not(.disabled):not(.full):not(.selected) { 
            background-color: #f0fdfa; color: #0f766e; border-color: #5eead4; /* สีตอนชี้เมาส์ชัดขึ้น */
            transform: scale(1.08) translateY(-2px); z-index: 10; 
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.2); 
        }
        
        /* วันที่เลือก */
        .day-cell.selected { 
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%); /* เข้มขึ้นให้เด่นชัด */
            color: white; box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.6); 
            font-weight: 600; transform: scale(1.05); border: none; 
        }
        
        /* วันที่ถูกปิด (วันหยุด/วันเก่า) */
        .day-cell.disabled { 
            color: #94a3b8; background-color: #f1f5f9; /* ให้พื้นหลังเทาขึ้นนิดนึงแยกกับวันปกติ */
            cursor: not-allowed; opacity: 0.8; border: 1px dashed #cbd5e1; 
        }
        
        /* คิวเต็ม (ไล่สีชมพูอ่อน) */
        .day-cell.full { background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%); color: #e11d48; cursor: pointer; border-color: #fecdd3; }
        .day-cell.full:hover { transform: scale(1.02); box-shadow: 0 4px 12px rgba(225, 29, 72, 0.1); }
        .day-cell.full::after { 
            content: 'เต็ม'; display: block; font-size: 0.65rem; margin-top: -2px; font-weight: 700; 
            color: #be123c; background: rgba(255,255,255,0.5); padding: 0 4px; border-radius: 4px;
        }
        
        /* วันนี้ */
        .day-cell.today { border: 2px solid #818cf8; color: #4338ca; background-color: #eef2ff; font-weight: 700; }
        
        /* Form Radio */
        .time-radio:checked + div { background-color: #eef2ff; border-color: #4f46e5; color: #4f46e5; box-shadow: 0 0 0 1.5px #4f46e5; font-weight: 600; }
        .time-radio:disabled + div { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }

        /* Loader */
        .loader-overlay { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); }
        .spinner { border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- หน้าต่างเข้าสู่ระบบ (Login) -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white/30 backdrop-blur-md">
        <div class="bg-white/95 p-8 md:p-10 rounded-3xl shadow-[0_20px_50px_rgba(79,70,229,0.1)] w-full max-w-md mx-4 border border-white">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 text-indigo-600 mb-4 shadow-sm">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">ระบบจองคิวลงแลปโรงพยาบาลศรีสะเกษ</h1>
                <p class="text-slate-500 text-sm mt-1">เครือข่าย NCD อำเภอเมืองศรีสะเกษ</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผู้ใช้งาน</label>
                    <input type="text" id="login-username" placeholder="รหัสหน่วยบริการ 5 หลัก หรือ admin" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-slate-50 focus:bg-white text-slate-800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" placeholder="••••••••" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all bg-slate-50 focus:bg-white text-slate-800">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3.5 rounded-xl transition-colors shadow-sm mt-2">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>
    </div>

    <!-- คอนเทนเนอร์หลัก (เต็มจอ) -->
    <div id="main-app" class="hidden flex-1 flex flex-col w-full h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 z-10 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800">ระบบจองคิวลงแลป</h1>
            </div>
            
            <!-- เมนู User -->
            <div class="flex items-center gap-3">
                <div class="bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span id="header-user-text">กำลังโหลด...</span>
                </div>
                <button onclick="openChangePasswordModal()" class="text-slate-500 hover:text-indigo-600 bg-white border border-slate-200 hover:border-indigo-200 p-2 rounded-lg transition-colors" title="เปลี่ยนรหัสผ่าน">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
                <div id="admin-tools" class="hidden">
                    <button onclick="openAdminModal()" class="text-amber-600 hover:bg-amber-50 bg-white border border-amber-200 p-2 rounded-lg transition-colors flex items-center gap-1" title="ตั้งค่าโควต้า">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    </button>
                </div>
                <button onclick="logout()" class="text-rose-500 hover:bg-rose-50 bg-white border border-rose-200 p-2 rounded-lg transition-colors" title="ออกจากระบบ">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <!-- พื้นที่แสดงข้อมูลหลัก -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 no-scrollbar w-full">
            
            <!-- Dashboard โควต้า (ซ่อนไว้สำหรับแอดมิน) -->
            <div id="quota-dashboard" class="hidden w-full max-w-7xl mx-auto mb-6 layout-transition opacity-0 translate-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6">
                    <div class="bg-white rounded-3xl p-5 md:p-6 border border-slate-100 shadow-[0_4px_20px_rgb(0,0,0,0.03)] flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-slate-500 mb-1">โควต้ารายปี (<span id="qd-year"></span>)</p>
                            <div class="flex items-baseline gap-2">
                                <h4 class="text-3xl font-bold"><span id="qd-y-used" class="text-indigo-600">0</span> <span class="text-xl text-slate-400 font-medium">/</span> <span id="qd-y-total" class="text-slate-700">0</span></h4>
                                <span class="text-sm font-medium text-slate-500">ครั้ง</span>
                            </div>
                        </div>
                        <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-500 flex items-center justify-center shadow-sm shrink-0">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-3xl p-5 md:p-6 border border-slate-100 shadow-[0_4px_20px_rgb(0,0,0,0.03)] flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-slate-500 mb-1">ลิมิตรายเดือน (<span id="qd-month"></span>)</p>
                            <div class="flex items-baseline gap-2">
                                <h4 class="text-3xl font-bold"><span id="qd-m-used" class="text-emerald-500">0</span> <span class="text-xl text-slate-400 font-medium">/</span> <span id="qd-m-total" class="text-slate-700">0</span></h4>
                                <span class="text-sm font-medium text-slate-500">ครั้ง</span>
                            </div>
                        </div>
                        <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center shadow-sm shrink-0">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Layout Grid -->
            <div id="layout-wrapper" class="w-full max-w-7xl mx-auto layout-transition grid grid-cols-1 gap-6 lg:gap-8 transition-all duration-300">
                
                <!-- ฝั่งซ้าย: ปฏิทินและฟอร์ม -->
                <div id="left-panel" class="layout-transition flex flex-col gap-6 w-full">
                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <button id="prev-month" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors font-medium text-sm flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> เดือนก่อน
                            </button>
                            <h2 id="month-year" class="text-xl font-bold text-indigo-600"></h2>
                            <button id="next-month" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors font-medium text-sm flex items-center gap-1">
                                เดือนหน้า <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-7 gap-2 md:gap-4 text-center mb-4">
                            <div class="text-[13px] font-bold text-rose-600 bg-rose-50 py-1.5 rounded-lg shadow-sm">อา</div>
                            <div class="text-[13px] font-bold text-slate-600 bg-slate-50 py-1.5 rounded-lg shadow-sm border border-slate-100">จ</div>
                            <div class="text-[13px] font-bold text-slate-600 bg-slate-50 py-1.5 rounded-lg shadow-sm border border-slate-100">อ</div>
                            <div class="text-[13px] font-bold text-slate-600 bg-slate-50 py-1.5 rounded-lg shadow-sm border border-slate-100">พ</div>
                            <div class="text-[13px] font-bold text-slate-600 bg-slate-50 py-1.5 rounded-lg shadow-sm border border-slate-100">พฤ</div>
                            <div class="text-[13px] font-bold text-slate-600 bg-slate-50 py-1.5 rounded-lg shadow-sm border border-slate-100">ศ</div>
                            <div class="text-[13px] font-bold text-indigo-600 bg-indigo-50 py-1.5 rounded-lg shadow-sm">ส</div>
                        </div>
                        
                        <div id="calendar-days" class="grid grid-cols-7 gap-2 md:gap-4 text-center"></div>
                    </div>

                    <!-- ฟอร์มการจอง -->
                    <div id="booking-form" class="hidden bg-white p-6 md:p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 layout-transition opacity-0 translate-y-4">
                        <div class="flex items-center gap-2 mb-6">
                            <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800" id="form-title">กรอกข้อมูลการจองใหม่</h3>
                        </div>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-slate-500 mb-1">วันที่เลือก:</label>
                                <input type="text" id="selected-date-display" readonly class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 font-medium outline-none">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-500 mb-2">เลือกเวลา (รับวันละ 2 คิว):</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="relative cursor-pointer">
                                        <input type="radio" name="time" value="08:00" class="peer sr-only time-radio">
                                        <div class="px-4 py-3 rounded-xl border border-slate-200 text-center text-slate-600 transition-all">
                                            08:00 น.
                                        </div>
                                    </label>
                                    <label class="relative cursor-pointer">
                                        <input type="radio" name="time" value="09:00" class="peer sr-only time-radio">
                                        <div class="px-4 py-3 rounded-xl border border-slate-200 text-center text-slate-600 transition-all">
                                            09:00 น.
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-500 mb-1">หน่วยบริการของคุณ:</label>
                                <select id="location-select" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white text-slate-700">
                                    <option value="">-- โปรดเลือกเวลาด้านบนก่อน --</option>
                                </select>
                            </div>

                            <div class="flex gap-3 pt-2">
                                <button id="cancel-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 rounded-xl transition-colors">ยกเลิก</button>
                                <button id="confirm-btn" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">ยืนยันการจอง</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ฝั่งขวา: รายการจอง (ซ่อนไว้จนกว่าจะกดวันที่) -->
                <div id="right-panel" class="hidden layout-transition flex flex-col h-full opacity-0 translate-y-4 w-full">
                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex flex-col h-[calc(100vh-10rem)] lg:h-[calc(100vh-8rem)]">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100 shrink-0">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                                </div>
                                <h2 id="list-title" class="text-xl font-bold text-slate-800">รายการจองทั้งหมด</h2>
                            </div>
                        </div>
                        
                        <div id="booking-list" class="flex-1 overflow-y-auto pr-2 space-y-3 no-scrollbar pb-10">
                            <!-- รายการจะโผล่ที่นี่ -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal ตั้งค่าโควต้า (Admin) -->
    <div id="admin-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center shrink-0">

    <script>
        // === ตั้งค่า Firebase ===
        const firebaseConfig = {

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ฐานข้อมูลสถานที่

            "03277: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านคูซอด ตำบลคูซอด",
            "03278: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านแทง ตำบลซำ",

            "03281: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านหนองครกใต้ ตำบลหนองครก",

            "03289: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านน้ำคำ ตำบลน้ำคำ",
            "03290: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านหนองโน ตำบลน้ำคำ",
            "03291: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านโพธิ์ ตำบลโพธิ์",
            "03292: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านก้านเหลือง ตำบลหมากเขียบ",
            "03293: โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านหนองไผ่ ตำบลหนองไผ่",
            "10700: โรงพยาบาลศรีสะเกษ",
            "14422: ศูนย์บริการสาธารณสุข2",
            "15204: ศูนย์บริการสาธารณสุข 3",
            "21986: ศูนย์บริการสาธารณสุข(เทศบาล 4)",
            "23954: ศูนย์บริการสาธารณสุข 5",
            "77475: ศูนย์สุขภาพชุมชนเขตเมือง โรงพยาบาลศรีสะเกษ (สังกัด สธ.)"
        ];
        const holidays = ["2026-01-01", "2026-03-03", "2026-04-06", "2026-04-13", "2026-04-14", "2026-04-15", "2026-05-01", "2026-05-04", "2026-05-31", "2026-06-03", "2026-07-28", "2026-07-29", "2026-08-12", "2026-10-13", "2026-10-23", "2026-12-05", "2026-12-10", "2026-12-31"];

        let currentDate = new Date();
        let selectedDate = null;
        let allBookingsList = []; 
        let allYearlyQuotas = {}; 
        let isAdmin = false;
        let currentUserLocation = null; 
        let currentUserId = null; 
        let editingId = null;

        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
            timerProgressBar: true, background: '#fff', color: '#1e293b',
            iconColor: '#4f46e5', customClass: { popup: 'rounded-2xl shadow-xl' }
        });
        
        function showLoader() { document.getElementById('loader').classList.replace('hidden', 'flex'); }
        function hideLoader() { document.getElementById('loader').classList.replace('flex', 'hidden'); }

        // === 1. ระบบเช็คการล็อกอินอัตโนมัติ (Auto Login) ===
        function checkAutoLogin() {
            const savedUid = localStorage.getItem('ncd_sskh_uid');
            if (savedUid) {
                document.getElementById('login-username').value = savedUid;
                // ให้ admin และ 10700 ได้สิทธิ์ Admin
                if (savedUid === 'admin' || savedUid === '10700') {
                    isAdmin = true; 
                    currentUserId = savedUid;
                    currentUserLocation = savedUid === '10700' ? "10700: โรงพยาบาลศรีสะเกษ" : "ADMIN";
                    document.getElementById('header-user-text').textContent = savedUid === '10700' ? "รพ.ศรีสะเกษ (Admin)" : "ผู้จัดการระบบ (Admin)";
                    document.getElementById('admin-tools').classList.remove('hidden');
                    finishLogin();
                } else {
                    const matchedLocation = allLocations.find(loc => loc.startsWith(savedUid));
                    if (matchedLocation) {
                        isAdmin = false; currentUserLocation = matchedLocation; currentUserId = savedUid;
                        document.getElementById('header-user-text').textContent = matchedLocation.split(': ')[1];
                        document.getElementById('admin-tools').classList.add('hidden');
                        finishLogin();
                    }
                }
            }
        }
        
        // เรียกระบบเช็คการล็อกอินทันทีที่เปิดเว็บ
        checkAutoLogin();

        // === 2. ระบบเข้าสู่ระบบแบบ Manual ===
        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;
            if (!username || !passwordInput) { Toast.fire({ icon: 'warning', title: 'กรุณากรอกข้อมูลให้ครบ' }); return; }

            showLoader();
            try {
                let actualPassword = "";
                let userDoc;
                try { userDoc = await db.collection('users').doc(username).get(); } catch(e) {}
                
                // ตรวจสอบสิทธิ์ Admin (สำหรับ admin และ 10700)
                if (username === 'admin' || username === '10700') {
                    actualPassword = (userDoc && userDoc.exists) ? userDoc.data().password : (username === 'admin' ? "sskhadmin2026" : username);
                    if (passwordInput === actualPassword) {
                        isAdmin = true; 
                        currentUserId = username;
                        currentUserLocation = username === '10700' ? "10700: โรงพยาบาลศรีสะเกษ" : "ADMIN";
                        document.getElementById('header-user-text').textContent = username === '10700' ? "รพ.ศรีสะเกษ (Admin)" : "ผู้จัดการระบบ (Admin)";
                        document.getElementById('admin-tools').classList.remove('hidden');
                        localStorage.setItem('ncd_sskh_uid', username); // บันทึกการเข้าสู่ระบบ
                        finishLogin();
                    } else throw new Error("รหัสผ่านไม่ถูกต้อง");
                } else {
                    // สำหรับ User ปกติ
                    const matchedLocation = allLocations.find(loc => loc.startsWith(username));
                    if (matchedLocation && username.length >= 5) {
                        actualPassword = (userDoc && userDoc.exists) ? userDoc.data().password : username;
                        if (passwordInput === actualPassword) {
                            isAdmin = false; currentUserLocation = matchedLocation; currentUserId = username;
                            document.getElementById('header-user-text').textContent = matchedLocation.split(': ')[1];
                            document.getElementById('admin-tools').classList.add('hidden');
                            localStorage.setItem('ncd_sskh_uid', username); // บันทึกการเข้าสู่ระบบ
                            finishLogin();
                        } else throw new Error("รหัสผ่านไม่ถูกต้อง");
                    } else throw new Error("ไม่พบรหัสผู้ใช้งานนี้ในระบบ");
                }
            } catch (error) {
                hideLoader(); Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: error.message, confirmButtonColor: '#4f46e5', customClass: { popup: 'rounded-3xl' }});
            }
        }
        document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });

        function finishLogin() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('main-app').classList.add('flex');
            hideLoader(); listenToData();
        }

        function logout() {
            currentUserLocation = null; isAdmin = false; currentUserId = null;
            localStorage.removeItem('ncd_sskh_uid'); // ลบความจำการเข้าสู่ระบบเมื่อกดออก
            document.getElementById('login-username').value = ''; document.getElementById('login-password').value = '';
            document.getElementById('main-app').classList.add('hidden'); document.getElementById('main-app').classList.remove('flex');
            document.getElementById('login-screen').classList.remove('hidden');
            selectedDate = null;
            setSplitLayout(false);
        }

        // === 3. เปลี่ยนรหัสผ่าน ===
        function openChangePasswordModal() {
            document.getElementById('new-pwd').value = ''; document.getElementById('confirm-pwd').value = '';
            document.getElementById('pwd-modal').classList.replace('hidden', 'flex');
        }
        function closePwdModal() { document.getElementById('pwd-modal').classList.replace('flex', 'hidden'); }
        async function saveNewPassword() {
            const p1 = document.getElementById('new-pwd').value; const p2 = document.getElementById('confirm-pwd').value;
            if (p1.length < 4) { Toast.fire({ icon: 'warning', title: 'รหัสผ่านต้อง 4 ตัวอักษรขึ้นไป' }); return; }
            if (p1 !== p2) { Toast.fire({ icon: 'warning', title: 'รหัสผ่านไม่ตรงกัน' }); return; }
            showLoader();
            try {
                await db.collection('users').doc(currentUserId).set({ password: p1 }, { merge: true });
                hideLoader(); closePwdModal();
                Swal.fire({ icon: 'success', title: 'เปลี่ยนรหัสผ่านสำเร็จ', confirmButtonColor: '#4f46e5', customClass: { popup: 'rounded-3xl' }});
            } catch (err) { hideLoader(); Toast.fire({ icon: 'error', title: err.message }); }
        }

        // === 4. ดึงข้อมูลแบบ Real-time ===
        function listenToData() {
            showLoader();
            db.collection('yearly_quotas').onSnapshot(snapshot => {
                allYearlyQuotas = {}; snapshot.forEach(doc => allYearlyQuotas[doc.id] = doc.data());
                if(selectedDate) updateFormOptions();
                if(!isAdmin) renderQuotaDashboard();
            });
            db.collection('bookings').onSnapshot(snapshot => {
                allBookingsList = []; snapshot.forEach(doc => allBookingsList.push({ id: doc.id, ...doc.data() }));
                renderCalendar();
                if(selectedDate) { renderBookingList(); updateFormOptions(); }
                hideLoader();
            }, err => { hideLoader(); Toast.fire({ icon: 'error', title: err.message }); });
        }

        // === 5. ควบคุม Layout แยก 2 ฝั่ง ===
        function setSplitLayout(active) {
            const wrapper = document.getElementById('layout-wrapper');
            const left = document.getElementById('left-panel');
            const right = document.getElementById('right-panel');
            const form = document.getElementById('booking-form');
            const dashboard = document.getElementById('quota-dashboard');

            if (active) {
                wrapper.classList.add('lg:grid-cols-2');
                if(!isAdmin && dashboard) dashboard.classList.remove('hidden');
                
                form.classList.remove('hidden'); right.classList.remove('hidden');
                setTimeout(() => { 
                    form.classList.remove('opacity-0', 'translate-y-4'); 
                    right.classList.remove('opacity-0', 'translate-y-4'); 
                    dashboard?.classList.remove('opacity-0', 'translate-y-4'); 
                }, 50);
            } else {
                form.classList.add('opacity-0', 'translate-y-4'); right.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => {
                    wrapper.classList.remove('lg:grid-cols-2');
                    form.classList.add('hidden'); right.classList.add('hidden');
                }, 300);
            }
        }

        function resetFormAndLayout() {
            editingId = null;
            document.querySelectorAll('.time-radio').forEach(r => r.checked = false);
            if(selectedDate) {
                document.getElementById('form-title').textContent = "กรอกข้อมูลการจองใหม่";
                document.getElementById('confirm-btn').textContent = "ยืนยันการจอง";
                updateFormOptions();
            }
        }

        // === 6. ปฏิทินและโควต้า ===
        function renderCalendar() {
            const calendarDaysEl = document.getElementById('calendar-days');
            calendarDaysEl.innerHTML = '';
            const month = currentDate.getMonth(), year = currentDate.getFullYear();
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            document.getElementById('month-year').textContent = `${thaiMonths[month]} ${year + 543}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date(); today.setHours(0,0,0,0);

            for (let i = 0; i < firstDay; i++) calendarDaysEl.innerHTML += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day-cell py-3 md:py-4 rounded-2xl cursor-pointer text-slate-700 font-medium flex flex-col items-center justify-center shadow-sm gap-0.5';
                
                const loopDate = new Date(year, month, day);
                const localDateStr = loopDate.toLocaleDateString('en-CA'); 
                const dayOfWeek = loopDate.getDay();
                const dayBookings = allBookingsList.filter(b => b.date === localDateStr);

                let dayContent = `<span class="text-base">${day}</span>`;
                let dotsHtml = '';

                if (loopDate < today) dayEl.classList.add('disabled');
                else if (dayOfWeek === 0 || dayOfWeek === 6 || holidays.includes(localDateStr)) dayEl.classList.add('disabled');
                else {
                    dayEl.dataset.date = localDateStr;
                    
                    // มีคิวแล้ว 1 คิว -> จุดสีเขียวเรืองแสง
                    if (dayBookings.length === 1) {
                        dotsHtml = `<div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_5px_rgba(52,211,153,0.8)]"></div>`;
                    }
                    // คิวเต็ม 2 คิว
                    if (dayBookings.length >= 2 && (!editingId || !dayBookings.find(b => b.id === editingId))) {
                        dayEl.classList.add('full'); 
                    }
                }

                if (loopDate.getTime() === today.getTime()) dayEl.classList.add('today');
                if (selectedDate === localDateStr) {
                    dayEl.classList.add('selected');
                    // ปรับสีจุดถ้าโดนระบายพื้นหลังน้ำเงิน
                    if(dayBookings.length === 1) {
                        dotsHtml = `<div class="w-1.5 h-1.5 rounded-full bg-white shadow-[0_0_5px_rgba(255,255,255,0.8)]"></div>`;
                    }
                }

                dayEl.innerHTML = dayContent + (dotsHtml ? dotsHtml : '<div class="w-1.5 h-1.5"></div>');
                calendarDaysEl.appendChild(dayEl);
            }
            renderQuotaDashboard();
        }

        function renderQuotaDashboard() {
            const dashboardEl = document.getElementById('quota-dashboard');
            if (isAdmin || !currentUserLocation) { dashboardEl.classList.add('hidden'); return; }
            
            const yyyy = currentDate.getFullYear().toString();
            const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            
            document.getElementById('qd-year').textContent = `ปี ${parseInt(yyyy) + 543}`;
            document.getElementById('qd-month').textContent = `${thaiMonths[currentDate.getMonth()]} ${parseInt(yyyy) + 543}`;
            
            let yCount = 0, mCount = 0;
            allBookingsList.forEach(b => {
                if (b.location === currentUserLocation) {
                    if (b.date.startsWith(yyyy)) yCount++;
                    if (b.date.startsWith(`${yyyy}-${mm}`)) mCount++;
                }
            });
            
            let q = allYearlyQuotas[yyyy]?.[currentUserLocation] || { yearly: 20, monthly: 6 };
            if (typeof q === 'number') q = { yearly: q, monthly: 1 };
            
            document.getElementById('qd-y-used').textContent = yCount;
            document.getElementById('qd-y-total').textContent = q.yearly;
            document.getElementById('qd-m-used').textContent = mCount;
            document.getElementById('qd-m-total').textContent = q.monthly;
            
            document.getElementById('qd-y-used').className = yCount >= q.yearly ? 'text-rose-500' : 'text-indigo-600';
            document.getElementById('qd-m-used').className = mCount >= q.monthly ? 'text-rose-500' : 'text-emerald-500';
        }

        // === 7. รายการจองฝั่งขวา ===
        function renderBookingList() {
            const listEl = document.getElementById('booking-list');
            listEl.innerHTML = '';
            
            if(!selectedDate) return;

            const dateObj = new Date(selectedDate);
            document.getElementById('list-title').innerHTML = `รายการจอง <span class="text-indigo-600 font-medium">(${dateObj.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'})})</span>`;

            const dayBookings = allBookingsList.filter(b => b.date === selectedDate).sort((a,b) => a.time.localeCompare(b.time));

            if (dayBookings.length === 0) {
                listEl.innerHTML = '<div class="text-center text-slate-400 py-16 italic">ยังไม่มีรายการจองในวันนี้</div>'; return;
            }

            dayBookings.forEach(b => {
                const locName = b.location.split(': ')[1] || b.location;
                // สิทธิ์ลบเฉพาะของตัวเอง หรือ Admin
                const isMyBooking = (!isAdmin && b.location === currentUserLocation);
                
                let actionHtml = '';
                if (isAdmin || isMyBooking) {
                    actionHtml = `
                        <div class="flex gap-2 mt-4 pt-3 border-t border-slate-50">
                            ${isAdmin ? `<button onclick="editBooking('${b.id}')" class="flex-1 py-1.5 text-xs font-medium bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100 transition">แก้ไข</button>` : ''}
                            <button onclick="deleteBooking('${b.id}')" class="flex-1 py-1.5 text-xs font-medium bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition">ยกเลิกคิวนี้</button>
                        </div>
                    `;
                }

                listEl.innerHTML += `
                    <div class="p-5 rounded-2xl border ${isMyBooking ? 'border-indigo-200 bg-indigo-50/40' : 'border-slate-100 bg-white'} shadow-sm hover:shadow-md transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-indigo-100 text-indigo-700 text-xs font-bold">
                                🕒 ${b.time} น.
                            </span>
                        </div>
                        <div class="text-[0.95rem] text-slate-700 font-medium leading-relaxed">${locName}</div>
                        ${actionHtml}
                    </div>
                `;
            });
        }

        // === 8. อัปเดตตัวเลือกฟอร์ม (เช็คโควต้า และเวลาซ้ำ) ===
        function updateFormOptions() {
            if (!selectedDate) return;
            const selectEl = document.getElementById('location-select');
            const confirmBtn = document.getElementById('confirm-btn');
            const selectedTime = document.querySelector('input[name="time"]:checked')?.value;
            
            const dayBookings = allBookingsList.filter(b => b.date === selectedDate && b.id !== editingId);
            document.querySelectorAll('.time-radio').forEach(radio => {
                const isTaken = dayBookings.some(b => b.time === radio.value);
                radio.disabled = isTaken;
                if (isTaken && radio.checked) radio.checked = false;
            });

            if (!selectedTime) {
                selectEl.innerHTML = '<option value="">-- โปรดเลือกเวลาด้านบนก่อน --</option>';
                confirmBtn.disabled = true; return;
            }

            const yyyy = selectedDate.substring(0, 4); const mm = selectedDate.substring(5, 7);   
            const locYearCount = {}, locMonthCount = {}, bookedToday = [];
            
            allBookingsList.forEach(b => {
                if (b.id !== editingId) {
                    if (b.date.startsWith(yyyy)) locYearCount[b.location] = (locYearCount[b.location] || 0) + 1;
                    if (b.date.startsWith(`${yyyy}-${mm}`)) locMonthCount[b.location] = (locMonthCount[b.location] || 0) + 1;
                    if (b.date === selectedDate) bookedToday.push(b.location);
                }
            });

            if (!isAdmin) {
                let q = allYearlyQuotas[yyyy]?.[currentUserLocation] || { yearly: 20, monthly: 6 };
                if (typeof q === 'number') q = { yearly: q, monthly: 1 }; 
                const yC = locYearCount[currentUserLocation] || 0, mC = locMonthCount[currentUserLocation] || 0;
                
                selectEl.disabled = true; confirmBtn.disabled = true;
                if (bookedToday.includes(currentUserLocation)) selectEl.innerHTML = `<option>-- จองวันนี้ไปแล้ว (1 คิว/วัน) --</option>`;
                else if (yC >= q.yearly) selectEl.innerHTML = `<option>-- โควต้าปีนี้เต็ม (${q.yearly} ครั้ง) --</option>`;
                else if (mC >= q.monthly) selectEl.innerHTML = `<option>-- โควต้าเดือนนี้เต็ม (${q.monthly} ครั้ง) --</option>`;
                else {
                    selectEl.innerHTML = `<option value="${currentUserLocation}">${currentUserLocation} (เหลือ ${q.monthly - mC} ครั้ง/ด.)</option>`;
                    selectEl.value = currentUserLocation; confirmBtn.disabled = false;
                }
            } else {
                selectEl.innerHTML = '<option value="">-- คลิกเพื่อเลือกสถานที่ --</option>';
                allLocations.filter(loc => {
                    let q = allYearlyQuotas[yyyy]?.[loc] || { yearly: 20, monthly: 6 };
                    if (typeof q === 'number') q = { yearly: q, monthly: 1 };
                    return (locYearCount[loc]||0) < q.yearly && (locMonthCount[loc]||0) < q.monthly && !bookedToday.includes(loc);
                }).forEach(loc => selectEl.innerHTML += `<option value="${loc}">${loc}</option>`);
                selectEl.disabled = false; confirmBtn.disabled = false;

                if (editingId) {
                    const eLoc = allBookingsList.find(b => b.id === editingId)?.location;
                    if (eLoc) {
                        if (!selectEl.querySelector(`option[value="${eLoc}"]`)) selectEl.innerHTML += `<option value="${eLoc}">${eLoc}</option>`;
                        selectEl.value = eLoc;
                    }
                }
            }
        }

        // === 9. การทำงานปุ่มและ Event Listeners ===
        document.getElementById('prev-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('next-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        
        document.getElementById('calendar-days').addEventListener('click', (e) => {
            const dayEl = e.target.closest('.day-cell');
            // ยอมให้กดวันที่เต็มหรืออดีตได้ เพื่อดูรายการจองฝั่งขวา แต่ฟอร์มจะไม่โผล่
            if (dayEl && dayEl.dataset.date) {
                selectedDate = dayEl.dataset.date;
                renderCalendar(); // อัปเดต UI ปฏิทิน
                document.getElementById('selected-date-display').value = new Date(selectedDate).toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                setSplitLayout(true);
                
                // ถ้าเป็นวันในอดีต หรือวันหยุด หรือคิวเต็ม จะซ่อนฟอร์ม ไม่ให้จอง
                if (dayEl.classList.contains('disabled') || (dayEl.classList.contains('full') && !editingId)) {
                    document.getElementById('booking-form').classList.add('hidden');
                } else {
                    document.getElementById('booking-form').classList.remove('hidden');
                    if(!editingId) {
                        document.querySelectorAll('.time-radio').forEach(r => r.checked = false);
                        document.getElementById('form-title').textContent = "กรอกข้อมูลการจองใหม่";
                        document.getElementById('confirm-btn').textContent = "ยืนยันการจอง";
                    }
                    updateFormOptions();
                    if(window.innerWidth < 1024) document.getElementById('booking-form').scrollIntoView({ behavior: 'smooth' });
                }
                renderBookingList(); 
            }
        });

        document.querySelectorAll('.time-radio').forEach(r => r.addEventListener('change', updateFormOptions));
        document.getElementById('cancel-btn').addEventListener('click', resetFormAndLayout);

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            const time = document.querySelector('.time-radio:checked')?.value;
            const location = document.getElementById('location-select').value;
            if (!time || !location) { Toast.fire({icon: 'warning', title: 'ระบุเวลาและสถานที่ให้ครบ'}); return; }

            const res = await Swal.fire({
                title: editingId ? 'ยืนยันการแก้ไข?' : 'ยืนยันการจอง?',
                html: `<div class="text-sm mt-2">วันที่ ${selectedDate} เวลา ${time} น.<br><span class="text-indigo-600 font-medium mt-2 block">${location}</span></div>`,
                icon: 'question', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#4f46e5', customClass: { popup: 'rounded-3xl' }
            });

            if (res.isConfirmed) {
                showLoader();
                try {
                    const payload = { date: selectedDate, time: time, location: location, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                    if (editingId) await db.collection('bookings').doc(editingId).update(payload);
                    else { payload.createdAt = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('bookings').add(payload); }
                    
                    Toast.fire({ icon: 'success', title: editingId ? 'อัปเดตแล้ว' : 'บันทึกเรียบร้อย' });
                    resetFormAndLayout();
                } catch (err) { hideLoader(); Toast.fire({ icon: 'error', title: err.message }); }
            }
        });

        // === 10. ฟังก์ชันแอดมินและการลบ ===
        window.deleteBooking = async function(id) {
            const b = allBookingsList.find(x => x.id === id);
            // Double Check ป้องกันการแฮคข้ามสิทธิ์
            if (!b || (!isAdmin && b.location !== currentUserLocation)) return;

            const res = await Swal.fire({ title: 'ยกเลิกคิวนี้?', text: "ไม่สามารถกู้คืนได้!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบ', customClass: { popup: 'rounded-3xl' }});
            if (res.isConfirmed) {
                showLoader();
                db.collection('bookings').doc(id).delete().then(() => {
                    hideLoader(); Toast.fire({ icon: 'success', title: 'ยกเลิกคิวสำเร็จ' });
                }).catch(e => { hideLoader(); Toast.fire({ icon: 'error', title: e.message }); });
            }
        }

        window.editBooking = function(id) {
            const t = allBookingsList.find(b => b.id === id);
            if(t && isAdmin) {
                editingId = id; selectedDate = t.date;
                currentDate = new Date(new Date(t.date).getFullYear(), new Date(t.date).getMonth(), 1);
                renderCalendar(); setSplitLayout(true);
                
                document.getElementById('booking-form').classList.remove('hidden');
                document.getElementById('form-title').textContent = "แก้ไขการจอง";
                document.getElementById('confirm-btn').textContent = "บันทึกการแก้ไข";
                document.getElementById('selected-date-display').value = new Date(selectedDate).toLocaleDateString('th-TH', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
                document.querySelectorAll('.time-radio').forEach(r => r.checked = (r.value === t.time));
                
                updateFormOptions();
                setTimeout(() => { document.getElementById('location-select').value = t.location; }, 50);
            }
        }

        // === 11. Modal โควต้า ===
        window.openAdminModal = function() {
            document.getElementById('admin-quota-year').value = new Date().getFullYear();
            renderAdminQuotaList(); document.getElementById('admin-modal').classList.replace('hidden', 'flex');
        }
        window.closeAdminModal = function() { document.getElementById('admin-modal').classList.replace('flex', 'hidden'); }

        window.renderAdminQuotaList = function() {
            const yyyy = document.getElementById('admin-quota-year').value;
            const container = document.getElementById('quota-list-container'); container.innerHTML = '';
            if (!yyyy) return;
            const q = allYearlyQuotas[yyyy] || {};
            
            allLocations.forEach((loc) => {
                let saved = q[loc], ly = 20, lm = 6;
                if (typeof saved === 'number') { ly = saved; lm = 1; } else if (saved) { ly = saved.yearly; lm = saved.monthly; }
                
                container.innerHTML += `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-white rounded-xl border border-slate-100 shadow-sm gap-3">
                        <span class="text-sm font-medium text-slate-700 flex-1">${loc}</span>
                        <div class="flex gap-3 w-full md:w-auto">
                            <div class="flex-1 md:w-24">
                                <label class="block text-[0.7rem] text-slate-500 mb-1">รายปี</label>
                                <input type="number" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-center input-yearly outline-none focus:border-indigo-500 font-medium" data-loc="${loc}" value="${ly}">
                            </div>
                            <div class="flex-1 md:w-24">
                                <label class="block text-[0.7rem] text-slate-500 mb-1">รายเดือน</label>
                                <input type="number" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-center input-monthly outline-none focus:border-indigo-500 font-medium text-indigo-600" data-loc="${loc}" value="${lm}">
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.saveQuotas = async function() {
            const yyyy = document.getElementById('admin-quota-year').value;
            if (!yyyy) return;
            const newQ = {};
            document.querySelectorAll('#quota-list-container > div').forEach(item => {
                const loc = item.querySelector('.input-yearly').dataset.loc;
                newQ[loc] = { yearly: parseInt(item.querySelector('.input-yearly').value)||20, monthly: parseInt(item.querySelector('.input-monthly').value)||6 }; 
            });
            showLoader();
            try {
                await db.collection('yearly_quotas').doc(yyyy).set(newQ);
                hideLoader(); closeAdminModal(); Toast.fire({ icon: 'success', title: 'บันทึกสำเร็จ' });
            } catch (err) { hideLoader(); Toast.fire({ icon: 'error', title: err.message }); }
        }
    </script>
</body>
</html>
